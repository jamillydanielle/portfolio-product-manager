<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Currículo — Jamilly Danielle</title>
  <style>
    :root{--accent:#a2bebf;--ink:#102b2d;--muted:#64787a;--border:#dbe7e7}
    *{box-sizing:border-box}
    body{margin:0;background:#f5f9f9;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    header{background:#fff;border-bottom:1px solid var(--border);padding:16px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
    .brand-icon{display:grid;place-items:center;width:40px;height:40px;background:var(--accent);border-radius:50%;font-size:22px}
    .brand strong{display:block;font-size:14px}.brand small{color:var(--muted);font-size:11px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{padding:11px 16px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--ink);text-decoration:none;font-size:13px;font-weight:650}
    .btn.primary{background:#587f81;color:#fff;border-color:#587f81}
    main{max-width:1120px;margin:26px auto;padding:0 20px}
    h1{font-size:23px;letter-spacing:-.03em;margin:0 0 16px}
    .viewer{height:calc(100vh - 175px);min-height:520px;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0}
    .fallback{font-size:13px;color:var(--muted);margin-top:12px}
    .fallback a{color:#365f61}
    @media(max-width:650px){header{padding:14px 18px}.viewer{height:calc(100dvh - 230px);min-height:400px}main{margin:18px auto}.btn{font-size:12px;padding:9px 11px}}
  </style>
</head>
<body>
  <header>
    <a href="./index.html" class="brand"><span class="brand-icon" aria-hidden="true">✦</span><span><strong>Jamilly Danielle</strong><small>Product Manager</small></span></a>
    <div class="actions">
      <a class="btn" href="./index.html">← Voltar ao portfólio</a>
      <a class="btn primary" href="./assets/docs/curriculo.pdf" download="Curriculo_Jamilly_Danielle.pdf">↓ Baixar currículo</a>
    </div>
  </header>
  <main>
    <h1>Meu currículo</h1>
    <div class="viewer"><iframe src="./assets/docs/curriculo.pdf#view=FitH" title="Currículo de Jamilly Danielle em PDF"></iframe></div>
    <p class="fallback">Se o PDF não aparecer no navegador, <a href="./assets/docs/curriculo.pdf" target="_blank" rel="noopener noreferrer">abra o arquivo diretamente</a>.</p>
  </main>
</body>
</html>
